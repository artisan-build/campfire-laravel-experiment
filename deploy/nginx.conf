pid /tmp/campfire-nginx.pid;
worker_processes 2;
events { worker_connections 4096; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 sendfile on;
 gzip on;
 gzip_types text/css application/javascript application/json text/vnd.turbo-stream.html;
 server {
 listen HTTP_PORT;
 root /rails/public;
 index index.php;
 client_max_body_size 105m;
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location = /index.php { include /tmp/campfire-fastcgi_params; fastcgi_param HTTP_HOST $host:$server_port; fastcgi_param SCRIPT_FILENAME /rails/public/index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass 127.0.0.1:FPM_PORT; }
 location ~ \.php$ { return 404; }
 }
}
